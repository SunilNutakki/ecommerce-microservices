spring.application.name=api-gateway

server.port=8080

# Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Gateway Discovery Locator
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.access=read-only

# Central Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Product Service
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/product-service/v3/api-docs

# Cart Service
springdoc.swagger-ui.urls[1].name=Cart Service
springdoc.swagger-ui.urls[1].url=/cart-service/v3/api-docs

# Inventory Service
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/inventory-service/v3/api-docs

# Default selected API
springdoc.swagger-ui.urls-primary-name=Product Service