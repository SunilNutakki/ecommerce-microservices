spring.application.name=product-service





spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA -- Hibernate  properites
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#  Embedded tomcat server port
#server.port=4041
#  ContextPath of application  while running   in Embedded Tomcat server
#server.servlet.context-path=/MappingTagHims

# External folder path (Windows)
app.images.path=file:///D:/Assets/images/
app.image.base-url=http://localhost:8086/images/
server.port=8082
#https://chatgpt.com/c/6a6ee3aa-f950-83ee-a976-6f7b91ce808e

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true